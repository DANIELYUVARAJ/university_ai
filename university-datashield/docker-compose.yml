version: '3.8'

# =============================================================================
# University DataShield - Production Compose Orchestration
# Phase 11: Production Security, Scalability & Deployment
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DataShield API Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datashield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/datashield.db
      - AUTH_ENABLED=true
      - AUTH_ISSUER=https://auth.university.edu
      - AUTH_AUDIENCE=university-datashield-api
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=120
      - MAX_UPLOAD_SIZE_MB=50
      - LOG_LEVEL=INFO
    volumes:
      - datashield-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/ready').getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # DataShield Asynchronous Worker Service (Dedicated Worker Replica)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datashield-worker
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/datashield.db
      - AUTH_ENABLED=true
      - AUTH_ISSUER=https://auth.university.edu
      - AUTH_AUDIENCE=university-datashield-api
      - LOG_LEVEL=INFO
    volumes:
      - datashield-data:/app/data
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # DataShield Frontend (Vite Production Static / Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: datashield-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    depends_on:
      - backend

volumes:
  datashield-data:
    driver: local
